[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stckr"
version = "0.1.0"
description = "Local, linear-RAW focus stacking studio"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["numpy>=2.2,<3", "opencv-python-headless>=4.11,<5", "rawpy>=0.25,<0.28", "tifffile>=2026.10.15", "Pillow>=11,<13", "PySide6>=6.8,<7", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "pyinstaller>=6,<7"]

[project.scripts]
stckr = "stckr.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stckr"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
